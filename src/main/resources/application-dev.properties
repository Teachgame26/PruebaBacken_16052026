# Configuración específica para desarrollo - application-dev.properties
# Activar este perfil con: spring.profiles.active=dev

# Puerto para desarrollo
server.port=8080

# DataSource configurado para desarrollo local
spring.datasource.url=jdbc:mysql://localhost:3306/teach_game_dev?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate en modo desarrollo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging detallado para desarrollo
logging.level.root=INFO
logging.level.com.grupo6=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=DEBUG
