# Configuración de Spring Boot - Proyecto Teach Game Grupo 6
# Perfil: development

# Puerto de la aplicación
server.port=8080

# Configuración de DataSource (Base de Datos)
spring.datasource.url=jdbc:mysql://localhost:3306/teach_game_db
spring.datasource.username=root
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de logging
logging.level.root=INFO
logging.level.com.grupo6=DEBUG
logging.level.org.springframework.web=DEBUG

# Documentacion OpenAPI y Scalar
scalar.enabled=true
scalar.path=/docs
scalar.theme=deepSpace
